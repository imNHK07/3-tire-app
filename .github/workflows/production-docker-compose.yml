version: '3.8'

services:
  db:
    image: postgres:14
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: ${DB_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecommerce_pass}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecommerce_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_USERNAME:-username}/ecommerce-backend:latest
    container_name: ecommerce-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_pass}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DB_PORT: 5432
      NODE_ENV: production
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${DOCKER_USERNAME:-username}/ecommerce-frontend:latest
    container_name: ecommerce-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://${SERVER_DOMAIN:-localhost}:5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app:
    image: ${DOCKER_USERNAME:-username}/ecommerce-app:latest
    container_name: ecommerce-app
    ports:
      - "8080:8080"
    environment:
      FLASK_ENV: production
      DB_HOST: db
      DB_USER: ${DB_USER:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_pass}
      DB_NAME: ${DB_NAME:-ecommerce_db}
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
    driver: local

networks:
  default:
    name: ecommerce-network
